name: Build & Publish Docker image

on:
  # 只在 main 推送时构建（tag 推送不再触发，避免同一 commit 构建两遍）
  push:
    branches: [main]
    # 纯文档/图片改动不触发镜像构建（省时省钱）
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一分支的新推送会取消上一次还没跑完的构建
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    # 固定 24.04：ubuntu-latest 将在 2026-10 迁到 26.04，避免构建环境漂移
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 词条一致性检查（中文/英文 key 必须齐平，无需安装依赖）
      - name: Check i18n keys
        run: node scripts/check-i18n.mjs

      # 版本号唯一来源：package.json（发布新版本 = 改这里再推）
      - id: ver
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.value }}
            type=sha,prefix=

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
